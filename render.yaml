# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repository. Step-by-step: DEPLOY_RENDER.md
services:
  - type: web
    name: internship-finder
    runtime: docker
    dockerfilePath: ./Dockerfile
    # FREE plan: no persistent disk, so the database is wiped whenever the service sleeps (15 min idle),
    # restarts or redeploys. Browsers automatically re-create their student's profile; tracked applications reset.
    # To keep data: set `plan: starter` and add
    #   disk:
    #     name: internship-data
    #     mountPath: /var/data
    #     sizeGB: 1
    plan: free
    region: frankfurt          # closest Render region to Kenya
    healthCheckPath: /health
    envVars:
      - key: INTERNSHIP_DATA_DIR
        value: /var/data
      - key: MAX_CONCURRENT_SCRAPES
        value: "2"
      # "Apply Automatically" email. Render's free plan blocks SMTP, so email goes through Brevo's HTTPS API.
      # Render asks for these when the Blueprint is created; leave them empty to launch without email sending.
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM          # the sender address you verified in Brevo
        sync: false
